---
layout: base
---
<article class="post-section reveal">
  <header class="post-header">
    <span class="blog-badge {{ page.tipo | default: 'pro' }}">{{ page.tipo | default: 'pro' | capitalize }}</span>
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %Y" }}</p>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <div style="margin-top: 56px; padding-top: 32px; border-top: var(--border);">
    <a href="{{ '/blog/' | relative_url }}" style="
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text);
      text-decoration: none;
      padding: 10px 20px;
      border: var(--border);
      background: var(--card-bg);
      display: inline-block;
      transition: background .1s, color .1s, transform .1s, box-shadow .1s;
    " onmouseover="this.style.background='var(--text)';this.style.color='var(--bg)';this.style.transform='translate(-2px,-2px)';this.style.boxShadow='var(--sh)'"
       onmouseout="this.style.background='var(--card-bg)';this.style.color='var(--text)';this.style.transform='none';this.style.boxShadow='none'">← Volver al blog</a>
  </div>
</article>
